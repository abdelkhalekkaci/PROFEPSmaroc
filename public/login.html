<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à ProfEPS pour accéder à votre espace personnel, historique de generation et favoris.">
    <title>Connexion | ProfEPS Maroc</title>
    <link rel="icon" type="image/png" href="/images/prof_eps.png">
    <link rel="canonical" href="https://www.profeps.ma/login.html">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #c1272d;
            --primary-dark: #a01f24;
            --secondary: #006233;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a68;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --border: #e2e8f0;
            --radius: 8px;
            --radius-lg: 12px;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, rgba(193,39,45,0.05) 0%, rgba(0,98,51,0.05) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }
        
        .btn-social {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-social:hover {
            background: var(--bg-secondary);
        }
        
        .btn-social.google::before {
            content: "G";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc05, #34a853);
            color: white;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
        }
        
        .divider {
            text-align: center;
            color: #999;
            margin-bottom: 16px;
        }
        
        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            background: #0051a2;
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .switcher {
            text-align: center;
            cursor: pointer;
            color: #0070f3;
            margin-top: 16px;
        }
        
        .switcher:hover {
            text-decoration: underline;
        }
        
        .message {
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .message.error {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .message.success {
            background: #dcfce7;
            color: #16a34a;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 id="formTitle">🔑 Connexion</h2>
        
        <div id="message" class="message" style="display: none;"></div>
        
        <!-- Bouton Google -->
        <button class="btn-social google" id="googleBtn" onclick="handleGoogle()">
            🔵 Continuer avec Google
        </button>
        
        <div class="divider">— ou —</div>
        
        <!-- Email -->
        <input type="email" id="email" placeholder="Email" required>
        
        <!-- Mot de passe -->
        <input type="password" id="password" placeholder="Mot de passe" required>
        
        <!-- Bouton principal -->
        <button class="btn-primary" id="submitBtn" onclick="handleEmail()">
            🔑 Se connecter
        </button>
        
        <!-- Switcher -->
        <p class="switcher" onclick="toggleMode()">
            <span id="switchText">Pas encore de compte ? S'inscrire</span>
        </p>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Configuration Supabase avec les clés intégrées
        const supabase = window.supabase.createClient(
            'https://gbbqxalebmeeqgdountd.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYnF4YWxlYm1lZXFnZG91bnRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTQ1NjYsImV4cCI6MjA4ODQ3MDU2Nn0.HRM35OtgfLv52jDwiqF155bCGf85ynWIw0LXJDhimQk'
        );
        
        let isLogin = true;
        let loading = false;
        
        // Basculer entre connexion et inscription
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('formTitle').textContent = isLogin ? '🔑 Connexion' : '📝 Inscription';
            document.getElementById('submitBtn').textContent = isLogin ? '🔑 Se connecter' : '📝 S\'inscrire';
            document.getElementById('switchText').textContent = isLogin ? 'Pas encore de compte ? S\'inscrire' : 'Déjà un compte ? Se connecter';
            hideMessage();
        }
        
        // Afficher les messages
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
        
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }
        
        // Connexion Google
        async function handleGoogle() {
            if (loading) return;
            loading = true;
            updateButton(true);
            
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: `${window.location.origin}/dashboard.html` }
            });
            
            if (error) {
                showMessage('❌ ' + error.message, 'error');
            }
            
            loading = false;
            updateButton(false);
        }
        
        // Connexion/Inscription email
        async function handleEmail() {
            if (loading) return;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }
            
            loading = true;
            updateButton(true);
            hideMessage();
            
            try {
                if (isLogin) {
                    // Connexion
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    
                    showMessage('✅ Connecté avec succès !', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    // Inscription
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    
                    showMessage('✅ Vérifiez votre email pour confirmer !', 'success');
                }
            } catch (error) {
                showMessage('❌ ' + error.message, 'error');
            }
            
            loading = false;
            updateButton(false);
        }
        
        // Mettre à jour le bouton
        function updateButton(isLoading) {
            const btn = document.getElementById('submitBtn');
            const googleBtn = document.getElementById('googleBtn');
            
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> Chargement...';
                googleBtn.disabled = true;
            } else {
                btn.disabled = false;
                btn.textContent = isLogin ? '🔑 Se connecter' : '📝 S\'inscrire';
                googleBtn.disabled = false;
            }
        }
        
        // Vérifier si déjà connecté
        supabase.auth.getSession().then(({ data }) => {
            if (data.session) {
                window.location.href = '/dashboard.html';
            }
        });
    </script>
</body>
</html>
